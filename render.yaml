services:
  - type: web
    name: pallet-sorter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: pallet-sorter-db
          property: connectionString

databases:
  - name: pallet-sorter-db
    plan: free
